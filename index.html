<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e2c26">
<meta name="robots" content="noindex">
<title>tOca Dominó</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
:root {
  --felt: #17443b; --felt-deep: #0e2c26; --felt-line: #2c6255;
  --ivory: #f4eddb; --ivory-edge: #cfc3a4; --pip: #1c1915;
  --mustard: #e6b43f; --ink: #eef4f0; --muted: #a3c1b7; --ok: #8fd19e;
  --display: "Alfa Slab One", "Rockwell", Georgia, serif;
  --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; color: var(--ink); font: 16px/1.5 var(--body);
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 5px), radial-gradient(110% 80% at 50% 38%, var(--felt) 0%, var(--felt-deep) 100%);
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
main { width: min(440px, 100%); display: grid; gap: 18px; justify-items: center; text-align: center; }
h1 { font-family: var(--display); font-weight: 400; font-size: 2.1rem; margin: 0; color: var(--ivory); }
h1 span { color: var(--mustard); }
.tiles { display: flex; gap: 14px; height: 110px; align-items: flex-end; }
.tiles svg { width: 52px; height: auto; filter: drop-shadow(0 6px 8px rgba(0,0,0,.45)); animation: hop 1.5s ease-in-out infinite; transform-origin: 50% 100%; }
.tiles svg:nth-child(2) { animation-delay: .18s; }
.tiles svg:nth-child(3) { animation-delay: .36s; }
@keyframes hop { 0%, 55%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-16px) rotate(-4deg); } }
.status { font-size: 1.2rem; font-weight: 800; min-height: 1.6em; }
.sub { color: var(--muted); font-size: .95rem; min-height: 3em; max-width: 36ch; }
.invite { background: color-mix(in srgb, var(--mustard) 16%, var(--felt-deep)); border: 1px solid var(--mustard); border-radius: 12px; padding: 8px 14px; font-weight: 800; }
.invite b { color: var(--mustard); letter-spacing: .08em; }
.bar { width: min(320px, 100%); height: 6px; border-radius: 999px; background: var(--felt); overflow: hidden; }
.bar i { display: block; height: 100%; width: 40%; border-radius: 999px; background: var(--mustard); animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
.done .bar i { animation: none; width: 100%; background: var(--ok); }
.clock { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
a.go { color: var(--ink); font-weight: 800; text-decoration: none; border-radius: 10px; padding: 9px 16px; box-shadow: inset 0 0 0 1px var(--felt-line); }
a.go:hover { background: var(--felt); }
a.go:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
.foot { color: var(--muted); font-size: .72rem; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<main id="app" aria-live="polite">
  <h1>tOca <span>Dominó</span></h1>
  <div class="tiles" aria-hidden="true">
    <svg viewBox="0 0 52 104"><rect x="1.5" y="1.5" width="49" height="101" rx="8" fill="#f4eddb" stroke="#cfc3a4" stroke-width="2"/><line x1="8" y1="52" x2="44" y2="52" stroke="#cfc3a4" stroke-width="2"/><circle cx="26" cy="52" r="2.6" fill="#a8873a"/><g fill="#1c1915"><circle cx="15" cy="15" r="4.2"/><circle cx="37" cy="15" r="4.2"/><circle cx="26" cy="27" r="4.2"/><circle cx="15" cy="39" r="4.2"/><circle cx="37" cy="39" r="4.2"/><circle cx="26" cy="77" r="4.2"/></g></svg>
    <svg viewBox="0 0 52 104"><rect x="1.5" y="1.5" width="49" height="101" rx="8" fill="#f4eddb" stroke="#cfc3a4" stroke-width="2"/><line x1="8" y1="52" x2="44" y2="52" stroke="#cfc3a4" stroke-width="2"/><circle cx="26" cy="52" r="2.6" fill="#a8873a"/><g fill="#1c1915"><circle cx="26" cy="27" r="4.2"/><circle cx="15" cy="65" r="4.2"/><circle cx="37" cy="65" r="4.2"/><circle cx="15" cy="89" r="4.2"/><circle cx="37" cy="89" r="4.2"/><circle cx="26" cy="77" r="4.2"/></g></svg>
    <svg viewBox="0 0 52 104"><rect x="1.5" y="1.5" width="49" height="101" rx="8" fill="#f4eddb" stroke="#cfc3a4" stroke-width="2"/><line x1="8" y1="52" x2="44" y2="52" stroke="#cfc3a4" stroke-width="2"/><circle cx="26" cy="52" r="2.6" fill="#a8873a"/><g fill="#1c1915"><circle cx="15" cy="15" r="4.2"/><circle cx="37" cy="39" r="4.2"/><circle cx="26" cy="27" r="4.2"/><circle cx="15" cy="65" r="4.2"/><circle cx="37" cy="89" r="4.2"/><circle cx="26" cy="77" r="4.2"/></g></svg>
  </div>
  <div class="invite" id="invite" hidden>Você foi chamado para a mesa <b id="code"></b></div>
  <div class="status" id="status">Acordando a mesa…</div>
  <div class="bar" aria-hidden="true"><i></i></div>
  <p class="sub" id="sub">O servidor descansa quando ninguém está jogando. Costuma levar menos de 1 minuto.</p>
  <div class="clock" id="clock" aria-hidden="true"></div>
  <a class="go" id="go" href="#">Abrir o jogo agora</a>
  <div class="foot">Developed by StenioBarros</div>
</main>
<script>
// Página de entrada do tOca Dominó. Fica num endereço que nunca dorme (GitHub Pages) e mostra uma tela amigável
// enquanto o servidor gratuito do Render acorda; assim que ele responde, leva o jogador ao jogo (com o código da mesa).
const PROD = 'https://tocadomino.onrender.com';
const local = ['localhost', '127.0.0.1'].includes(location.hostname);
const params = new URLSearchParams(location.search);
const GAME = local && params.get('game') ? params.get('game') : PROD; // ?game= só vale em testes locais
params.delete('game');
const qs = params.toString();
const target = `${GAME}/${qs ? '?' + qs : ''}`;
const mesa = (params.get('mesa') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
const $ = (id) => document.getElementById(id);
const GIVE_UP = 75000; // se passar disso, abre o jogo mesmo assim (a tela do próprio Render assume)

$('go').href = target;
if (mesa) { $('code').textContent = mesa; $('invite').hidden = false; }

const t0 = Date.now();
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let done = false;

function say(status, sub) { $('status').textContent = status; if (sub !== undefined) $('sub').textContent = sub; }
setInterval(() => {
  if (done) return;
  const s = Math.floor((Date.now() - t0) / 1000);
  $('clock').textContent = s >= 3 ? `${s} s` : '';
  if (s >= 45) say('Está demorando mais que o normal…', 'Vamos tentar abrir o jogo direto daqui a pouco. Você também pode tocar no botão abaixo.');
  else if (s >= 15) say('Quase lá…', 'O servidor gratuito leva um tempinho para acordar. Obrigado pela paciência!');
}, 500);

async function ready() {
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), 7000);
  try {
    const r = await fetch(`${GAME}/healthz`, { cache: 'no-store', signal: ctl.signal });
    return r.ok && (await r.text()).trim() === 'ok'; // a tela de espera do Render não devolve "ok"
  } catch { return false; } finally { clearTimeout(to); }
}
function go() {
  if (done) return;
  done = true;
  document.body.classList.add('done');
  say('Pronto! Abrindo o jogo…', 'Boa partida!');
  $('clock').textContent = '';
  setTimeout(() => location.replace(target), 450);
}
(async function loop() {
  while (!done) {
    if (await ready()) return go();
    if (Date.now() - t0 > GIVE_UP) return go();
    await sleep(2000);
  }
})();
</script>
</body>
</html>
